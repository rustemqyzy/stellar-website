<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <title>Stellar Pump Dashboard</title>
  <style>
    body { background-color: #f8f9fa; }
    .card-icon { font-size: 2rem; }
    .threshold-exceeded { border: 2px solid #dc3545; }
  </style>
</head>
<body>
  <!-- Навигация -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">Stellar Pump</a>
    </div>
  </nav>

  <div class="container">
    <!-- Кнопка теста уведомлений -->
    <div class="d-flex justify-content-end mb-3">
      <button id="btnNotify" class="btn btn-primary">
        <i class="fa fa-bell"></i> Тест уведомления
      </button>
    </div>
    <!-- Карточки датчиков -->
    <div class="row g-3" id="sensors">
      <!-- example card -->
      <div class="col-md-4">
        <div class="card text-center">
          <div class="card-body">
            <i class="fa fa-tint card-icon text-primary"></i>
            <h5 class="card-title">Уровень жидкости</h5>
            <p class="card-text" id="levelVal">Loading...</p>
          </div>
        </div>
      </div>
      <!-- Добавьте карточки для давления, вибрации, тока, температуры аналогично -->
      <div class="col-md-4">
        <div class="card text-center">
          <div class="card-body">
            <i class="fa fa-tachometer-alt card-icon text-success"></i>
            <h5 class="card-title">Давление</h5>
            <p class="card-text" id="pressureVal">Loading...</p>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card text-center">
          <div class="card-body">
            <i class="fa fa-microchip card-icon text-warning"></i>
            <h5 class="card-title">Вибрация</h5>
            <p class="card-text" id="vibrationVal">Loading...</p>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card text-center">
          <div class="card-body">
            <i class="fa fa-plug card-icon text-info"></i>
            <h5 class="card-title">Напряжение</h5>
            <p class="card-text" id="currentVal">Loading...</p>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card text-center">
          <div class="card-body">
            <i class="fa fa-thermometer-half card-icon text-danger"></i>
            <h5 class="card-title">Температура</h5>
            <p class="card-text" id="tempVal">Loading...</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Скрипты -->
  <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
  <script>
    // Запрашиваем разрешение на уведомления
    document.addEventListener('DOMContentLoaded', () => {
      if ('Notification' in window) {
        Notification.requestPermission();
      }
    });

    // Тестовая кнопка уведомления
    document.getElementById('btnNotify').onclick = () => {
      if (Notification.permission === 'granted') {
        new Notification('StellarSmartLift', {
          body: 'Тестовое уведомление от вашей системы мониторинга',
          icon: 'https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/svgs/solid/bell.svg'
        });
      }
    };

    // Инициализация Socket.io
    const socket = io('https://your-server-address'); // замените на ваш адрес

    // Пороговые значения
    const thresholds = { level: 20, pressure: 5, vibration: 50, current: 10, temp: 80 };

    // Обработчик новых данных
    socket.on('sensorData', data => {
      // Ожидаем объект { level, pressure, vibration, current, temp }
      ['level','pressure','vibration','current','temp'].forEach(key => {
        const el = document.getElementById(key + 'Val');
        el.textContent = data[key];
        // если превышен порог — подсветить и уведомить
        if (data[key] > thresholds[key]) {
          el.parentElement.parentElement.classList.add('threshold-exceeded');
          if (Notification.permission === 'granted') {
            new Notification(`Внимание: ${key}`, {
              body: `Значение ${data[key]} превысило порог ${thresholds[key]}`,
            });
          }
        } else {
          el.parentElement.parentElement.classList.remove('threshold-exceeded');
        }
      });
    });
  </script>
</body>
</html>
